<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">AutoTapper 的使用流程：取点、配置、开始、轮询点击</title>
  <desc id="wfDesc">四个步骤横向排列：01 取点记录位置，02 配置间隔与轮数，03 按「开始」运行，04 按点位顺序循环点击；一条虚线从第四步回到第一步表示循环。</desc>

  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" fill="#161616" />

  <g transform="translate(56 30)">
    <path d="M0 0 H246 V118 L228 136 H0 Z" fill="#222222" stroke="#353535" stroke-width="1.4" />
    <text class="mono" x="20" y="40" font-size="26" font-weight="700" fill="#FFFA00">01</text>
    <text class="ui" x="20" y="80" font-size="22" font-weight="700" fill="#F4F4F2">取点</text>
    <text class="ui" x="20" y="110" font-size="17" fill="#A3A3A3">轻触屏幕，记录位置</text>
  </g>

  <g transform="translate(330 30)">
    <path d="M0 0 H246 V118 L228 136 H0 Z" fill="#222222" stroke="#353535" stroke-width="1.4" />
    <text class="mono" x="20" y="40" font-size="26" font-weight="700" fill="#FFFA00">02</text>
    <text class="ui" x="20" y="80" font-size="22" font-weight="700" fill="#F4F4F2">配置</text>
    <text class="ui" x="20" y="110" font-size="17" fill="#A3A3A3">间隔、时长、轮数</text>
  </g>

  <g transform="translate(604 30)">
    <path d="M0 0 H246 V118 L228 136 H0 Z" fill="#222222" stroke="#353535" stroke-width="1.4" />
    <text class="mono" x="20" y="40" font-size="26" font-weight="700" fill="#FFFA00">03</text>
    <text class="ui" x="20" y="80" font-size="22" font-weight="700" fill="#F4F4F2">开始</text>
    <text class="ui" x="20" y="110" font-size="17" fill="#A3A3A3">按「开始」或主界面按钮</text>
  </g>

  <g transform="translate(878 30)">
    <path d="M0 0 H246 V118 L228 136 H0 Z" fill="#2A2A2A" stroke="#FFFA00" stroke-width="1.6" />
    <text class="mono" x="20" y="40" font-size="26" font-weight="700" fill="#FFFA00">04</text>
    <text class="ui" x="20" y="80" font-size="22" font-weight="700" fill="#F4F4F2">轮询点击</text>
    <text class="ui" x="20" y="110" font-size="17" fill="#A3A3A3">当前点位高亮</text>
  </g>

  <path d="M306 98 H326 M316 92 l8 6 -8 6 z" fill="#3A3A3A" stroke="#3A3A3A" stroke-width="1.4" />
  <path d="M580 98 H600 M590 92 l8 6 -8 6 z" fill="#3A3A3A" stroke="#3A3A3A" stroke-width="1.4" />
  <path d="M854 98 H874 M864 92 l8 6 -8 6 z" fill="#3A3A3A" stroke="#3A3A3A" stroke-width="1.4" />

  <path d="M1001 178 C 1001 208 950 208 900 208 H 200 C 150 208 99 208 99 178"
        fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 8" />
  <path d="M99 178 l-7 11 h14 z" fill="#3A3A3A" />
  <text class="mono" x="600" y="234" font-size="16" fill="#6E6E6E" text-anchor="middle">按点位顺序循环，直到轮数用完或手动停止</text>
</svg>
