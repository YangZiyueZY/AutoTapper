<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">AutoTapper：在任意应用里取点，按顺序轮流点击的 Android 工具</title>
  <desc id="heroDesc">左侧是项目名与一句价值说明，下方三个带编号的点位用虚线连成轮询回环；右侧是控制器的两种形态：展开是一条贴边竖条，自上而下为点位数读数、开始、取点、删点、详情、收起、关闭七格；点「详情」后窄条内侧多出一块只读读数板，显示状态、间隔、时长、轮数；左下方是收起后只剩的 40×54dp 贴边小标签。</desc>

  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- 底板：墨色，自带背景，浅色/深色主题下都成立 -->
  <rect width="1200" height="420" fill="#161616" />

  <!-- 顶部三色条：与 App 页面顶部同一元素 -->
  <g>
    <rect x="0" y="0" width="400" height="4" fill="#FF00F0" />
    <rect x="400" y="0" width="400" height="4" fill="#FFFA00" />
    <rect x="800" y="0" width="400" height="4" fill="#00FFA2" />
  </g>

  <g id="title-block">
    <text class="mono" x="56" y="78" font-size="19" letter-spacing="3.4" fill="#A3A3A3">// AUTO TAPPER</text>

    <text class="ui" x="56" y="156" font-size="64" font-weight="700" letter-spacing="-1" fill="#F4F4F2">AutoTapper</text>

    <text class="ui" x="56" y="204" font-size="26" fill="#C9C9C6">在任意应用里取点，按顺序轮流点击。</text>

    <text class="mono" x="56" y="248" font-size="19" fill="#A3A3A3">v1.3.0 │ Android 8.0+ │ 多点轮询 │ 无障碍 / Shizuku</text>
  </g>

  <!-- 轮询回环：三个编号点位 + 回到起点 -->
  <g id="poll-loop" transform="translate(56 300)">
    <path d="M236 52 H22" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="7 8" />
    <path d="M22 52 l14 -7 v14 z" fill="#3A3A3A" />

    <g>
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#FFFA00" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#161616">1</text>
    </g>
    <g transform="translate(104 0)">
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#2E2E2E" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#EDEDED">2</text>
    </g>
    <g transform="translate(208 0)">
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#2E2E2E" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#EDEDED">3</text>
    </g>

    <text class="ui" x="286" y="24" font-size="19" fill="#A3A3A3">每个点位各点一次，算一轮</text>
  </g>

  <!-- 右侧：贴边竖条控制器（展开态＝七格窄条 + 只读读数板；左下＝收起态贴边小标签） -->
  <g id="controller-panel" transform="translate(648 52)">
    <rect width="496" height="340" fill="#222222" stroke="#353535" stroke-width="1.5" />
    <g>
      <rect x="0.75" y="0.75" width="164.8" height="4" fill="#FF00F0" />
      <rect x="165.55" y="0.75" width="164.8" height="4" fill="#FFFA00" />
      <rect x="330.35" y="0.75" width="164.9" height="4" fill="#00FFA2" />
    </g>

    <!-- 左列：标题 + 收起态小标签 -->
    <text class="mono" x="22" y="56" font-size="16" letter-spacing="2.4" fill="#A3A3A3">// CONTROLLER</text>
    <text class="ui" x="22" y="100" font-size="23" font-weight="700" fill="#F4F4F2">贴边悬浮控制器</text>
    <text class="ui" x="22" y="132" font-size="17" fill="#A3A3A3">展开是一条 46dp 竖条</text>
    <text class="mono" x="22" y="174" font-size="13" letter-spacing="1.6" fill="#A3A3A3">// COLLAPSED</text>
    <g id="collapsed-tab">
      <path d="M22 188 H70 V244 L61 253 H22 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
      <text class="mono" x="45" y="218" font-size="21" font-weight="700" text-anchor="middle" fill="#F4F4F2">3</text>
      <path d="M51 230 L43 238 L51 246" fill="none" stroke="#A3A3A3" stroke-width="2.4" />
    </g>
    <text class="mono" x="84" y="224" font-size="14" letter-spacing="1.4" fill="#A3A3A3">40×54dp</text>
    <text class="ui" x="22" y="298" font-size="17" fill="#C9C9C6">收起后只剩这枚贴边标签</text>

    <!-- 读数板：点「详情」后贴在窄条内侧的只读读数 -->
    <g id="readout">
      <rect x="257" y="6" width="172" height="330" fill="#161616" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="267" y="38" font-size="13" letter-spacing="1.6" fill="#A3A3A3">// READOUT</text>
      <path d="M267 50 H419" stroke="#353535" stroke-width="1" />
      <text class="ui" x="267" y="93" font-size="16" fill="#A3A3A3">状态</text>
      <text class="mono" x="419" y="93" font-size="20" font-weight="700" text-anchor="end" fill="#F4F4F2">待命</text>
      <path d="M267 119.5 H419" stroke="#353535" stroke-width="1" />
      <text class="ui" x="267" y="162.5" font-size="16" fill="#A3A3A3">间隔</text>
      <text class="mono" x="419" y="162.5" font-size="20" font-weight="700" text-anchor="end" fill="#F4F4F2">100–180 ms</text>
      <path d="M267 189 H419" stroke="#353535" stroke-width="1" />
      <text class="ui" x="267" y="232" font-size="16" fill="#A3A3A3">时长</text>
      <text class="mono" x="419" y="232" font-size="20" font-weight="700" text-anchor="end" fill="#F4F4F2">50 ms</text>
      <path d="M267 258.5 H419" stroke="#353535" stroke-width="1" />
      <text class="ui" x="267" y="301.5" font-size="16" fill="#A3A3A3">轮数</text>
      <text class="mono" x="419" y="301.5" font-size="20" font-weight="700" text-anchor="end" fill="#F4F4F2">无限</text>
      <path d="M267 328 H419" stroke="#353535" stroke-width="1" />
    </g>

    <!-- 窄条：顶部读数额 + 开始 / 取点 / 删点 / 详情 / 收起 / 关闭 -->
    <g id="rail">
      <rect x="439" y="6" width="56" height="330" fill="#161616" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="467" y="31" font-size="22" font-weight="700" text-anchor="middle" fill="#F4F4F2">03</text>
      <text class="ui" x="467" y="42" font-size="12" text-anchor="middle" fill="#A3A3A3">点</text>
      <circle cx="467" cy="48" r="2" fill="#A3A3A3" />
      <path d="M439 55 H495" stroke="#353535" stroke-width="1" />
      <g>
        <path d="M439 56.4 H495 V92.67 L487 100.67 H439 Z" fill="#FFFA00" stroke="#FFFA00" stroke-width="1.4" />
        <path d="M446.8 73.73 L454.4 78.53 L446.8 83.33 Z" fill="#161616" />
        <text class="ui" x="476" y="75.53" font-size="17" text-anchor="middle" fill="#161616">开</text>
        <text class="ui" x="476" y="94.53" font-size="17" text-anchor="middle" fill="#161616">始</text>
      </g>
      <g>
        <path d="M439 102.67 H495 V138.93 L487 146.93 H439 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <path d="M445.8 124.8 H454.2 M450 120.6 V129" stroke="#EDEDED" stroke-width="1.7" />
        <text class="ui" x="476" y="121.8" font-size="17" text-anchor="middle" fill="#EDEDED">取</text>
        <text class="ui" x="476" y="140.8" font-size="17" text-anchor="middle" fill="#EDEDED">点</text>
      </g>
      <g>
        <path d="M439 148.93 H495 V185.2 L487 193.2 H439 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <path d="M445.8 171.07 H454.2" stroke="#EDEDED" stroke-width="1.7" />
        <text class="ui" x="476" y="168.07" font-size="17" text-anchor="middle" fill="#EDEDED">删</text>
        <text class="ui" x="476" y="187.07" font-size="17" text-anchor="middle" fill="#EDEDED">点</text>
      </g>
      <g>
        <path d="M439 195.2 H495 V231.47 L487 239.47 H439 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <path d="M445.8 213.73 H454.2 M445.8 217.33 H451.4 M445.8 220.93 H454.2" stroke="#EDEDED" stroke-width="1.4" />
        <text class="ui" x="476" y="214.33" font-size="17" text-anchor="middle" fill="#EDEDED">详</text>
        <text class="ui" x="476" y="233.33" font-size="17" text-anchor="middle" fill="#EDEDED">情</text>
      </g>
      <g>
        <path d="M439 241.47 H495 V277.73 L487 285.73 H439 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <path d="M447.4 259.4 L452.4 263.6 L447.4 267.8" fill="none" stroke="#EDEDED" stroke-width="1.7" />
        <text class="ui" x="476" y="260.6" font-size="17" text-anchor="middle" fill="#EDEDED">收</text>
        <text class="ui" x="476" y="279.6" font-size="17" text-anchor="middle" fill="#EDEDED">起</text>
      </g>
      <g>
        <path d="M439 287.73 H495 V324 L487 332 H439 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <path d="M446.4 306.27 L453.6 313.47 M453.6 306.27 L446.4 313.47" stroke="#EDEDED" stroke-width="1.7" />
        <text class="ui" x="476" y="306.87" font-size="17" text-anchor="middle" fill="#EDEDED">关</text>
        <text class="ui" x="476" y="325.87" font-size="17" text-anchor="middle" fill="#EDEDED">闭</text>
      </g>
    </g>
  </g>
</svg>