<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">AutoTapper：在任意应用里取点，按顺序轮流点击的 Android 工具</title>
  <desc id="heroDesc">左侧是项目名与一句价值说明，下方三个带编号的点位用虚线连成轮询回环；右侧是应用内悬浮控制器的面板结构，含 ADD、DEL、GO 三个按钮与状态、间隔、点位读数。</desc>

  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- 底板：墨色，自带背景，浅色/深色主题下都成立 -->
  <rect width="1200" height="420" fill="#161616" />

  <!-- 顶部三色条：与 App 页面顶部同一元素 -->
  <g>
    <rect x="0" y="0" width="400" height="4" fill="#FF00F0" />
    <rect x="400" y="0" width="400" height="4" fill="#FFFA00" />
    <rect x="800" y="0" width="400" height="4" fill="#00FFA2" />
  </g>

  <g id="title-block">
    <text class="mono" x="56" y="78" font-size="19" letter-spacing="3.4" fill="#A3A3A3">// AUTO TAPPER</text>

    <text class="ui" x="56" y="156" font-size="64" font-weight="700" letter-spacing="-1" fill="#F4F4F2">AutoTapper</text>

    <text class="ui" x="56" y="204" font-size="26" fill="#C9C9C6">在任意应用里取点，按顺序轮流点击。</text>

    <text class="mono" x="56" y="248" font-size="19" fill="#A3A3A3">v1.3.0 │ Android 7.0+ │ 多点轮询 │ 无障碍 / Shizuku</text>
  </g>

  <!-- 轮询回环：三个编号点位 + 回到起点 -->
  <g id="poll-loop" transform="translate(56 300)">
    <path d="M236 52 H22" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="7 8" />
    <path d="M22 52 l14 -7 v14 z" fill="#3A3A3A" />

    <g>
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#FFFA00" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#161616">1</text>
    </g>
    <g transform="translate(104 0)">
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#2E2E2E" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#EDEDED">2</text>
    </g>
    <g transform="translate(208 0)">
      <path d="M0 0 H32 V24 L24 32 H0 Z" fill="#2E2E2E" stroke="#3A3A3A" stroke-width="1.4" />
      <text class="mono" x="9" y="22" font-size="17" font-weight="700" fill="#EDEDED">3</text>
    </g>

    <text class="ui" x="286" y="24" font-size="19" fill="#A3A3A3">每个点位各点一次，算一轮</text>
  </g>

  <!-- 右侧：应用里的悬浮控制器 -->
  <g id="controller-panel" transform="translate(648 52)">
    <rect width="496" height="340" fill="#222222" stroke="#353535" stroke-width="1.5" />
    <g>
      <rect x="0.75" y="0.75" width="164.8" height="4" fill="#FF00F0" />
      <rect x="165.55" y="0.75" width="164.8" height="4" fill="#FFFA00" />
      <rect x="330.35" y="0.75" width="164.9" height="4" fill="#00FFA2" />
    </g>

    <g transform="translate(20 32)">
      <path d="M0 0 H74 V22 L66 30 H0 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
      <text class="ui" x="14" y="21" font-size="17" fill="#EDEDED">收起</text>
    </g>
    <text class="mono" x="112" y="55" font-size="15" letter-spacing="2.6" fill="#A3A3A3">// CONTROLLER</text>

    <text class="ui" x="20" y="100" font-size="25" font-weight="700" fill="#EDEDED">悬浮控制器</text>

    <g transform="translate(20 120)">
      <g>
        <path d="M0 0 H118 V46 L108 56 H0 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <text class="mono" x="20" y="37" font-size="19" letter-spacing="2.2" fill="#EDEDED">ADD</text>
      </g>
      <g transform="translate(128 0)">
        <path d="M0 0 H118 V46 L108 56 H0 Z" fill="#2E2E2E" stroke="#353535" stroke-width="1.4" />
        <text class="mono" x="20" y="37" font-size="19" letter-spacing="2.2" fill="#EDEDED">DEL</text>
      </g>
      <g transform="translate(256 0)">
        <path d="M0 0 H118 V46 L108 56 H0 Z" fill="#FFFA00" />
        <text class="mono" x="20" y="37" font-size="19" font-weight="700" letter-spacing="2.2" fill="#161616">GO</text>
      </g>
    </g>

    <g transform="translate(20 196)">
      <path d="M0 0 H456" stroke="#353535" stroke-width="1.4" />
      <text class="ui" x="0" y="29" font-size="18" fill="#A3A3A3">状态</text>
      <text class="mono" x="456" y="29" font-size="20" text-anchor="end" fill="#EDEDED">待命</text>
      <path d="M0 46 H456" stroke="#353535" stroke-width="1.4" />
      <text class="ui" x="0" y="75" font-size="18" fill="#A3A3A3">间隔</text>
      <text class="mono" x="456" y="75" font-size="20" text-anchor="end" fill="#EDEDED">100–180 ms</text>
      <path d="M0 92 H456" stroke="#353535" stroke-width="1.4" />
      <text class="ui" x="0" y="121" font-size="18" fill="#A3A3A3">点位</text>
      <text class="mono" x="456" y="121" font-size="20" text-anchor="end" fill="#EDEDED">3 个</text>
      <path d="M0 138 H456" stroke="#353535" stroke-width="1.4" />
    </g>
  </g>
</svg>
