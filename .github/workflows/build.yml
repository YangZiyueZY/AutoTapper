name: build-apk

# 推 main 或打 v* 标签时：跑单元测试 → 构建 Debug APK →（尽力）产出可复现 APK
# → 生成 Release 并把 APK 作为发行版资产附上。
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v3

      - name: 安装 platform 34 与 build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          name=$(grep -E 'versionName' app/build.gradle | head -1 | sed -E 's/.*"(.*)".*/\1/')
          code=$(grep -E 'versionCode' app/build.gradle | head -1 | tr -dc '0-9')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "版本：$name ($code)"

      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # 可复现 APK：固定时间戳重打包 + 同一把 debug 密钥重签。
      # 它依赖 build-tools 里的 zipalign/apksigner 与 python3，缺任何一样都不该让整个发布失败，
      # 所以这里 continue-on-error，下面统一挑一个可用的 APK 去发布。
      - name: 尝试产出可复现 APK
        continue-on-error: true
        env:
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: ./gradlew --no-daemon :app:reproApk

      - name: 准备发布资产
        id: asset
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.name }}"
          mkdir -p dist
          plain="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$plain" ]; then
            cp "$plain" "dist/AutoTapper-${name}.apk"
            echo "使用 assembleDebug 产物"
          else
            echo "::error::没有找到 APK 产物"
            exit 1
          fi
          sha=$(sha256sum "dist/AutoTapper-${name}.apk" | cut -d' ' -f1)
          size=$(stat -c%s "dist/AutoTapper-${name}.apk")
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "APK sha256=$sha（$size 字节）"
          # 打标签时用标签名，推 main 时用 v<versionName>
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          fi

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-${{ steps.version.outputs.name }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          name: AutoTapper ${{ steps.version.outputs.name }}
          body: |
            AutoTapper ${{ steps.version.outputs.name }}（versionCode ${{ steps.version.outputs.code }}）

            - 这是 **debug 签名** 的安装包，可直接装到自己的设备上；
              想用正式签名请按 README「从源码构建」自己签一次。
            - APK SHA-256：`${{ steps.asset.outputs.sha256 }}`
            - 本次提交：`${{ github.sha }}`
            - 单元测试：本次构建已跑 `:app:testDebugUnitTest`

            更新日志见 CHANGELOG.md。
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false